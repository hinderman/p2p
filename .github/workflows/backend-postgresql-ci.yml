name: Backend PostgreSQL CI

on:
  push:
    paths:
      - "back/**"
      - ".database/**"
      - ".github/workflows/backend-postgresql-ci.yml"
  pull_request:
    paths:
      - "back/**"
      - ".database/**"
      - ".github/workflows/backend-postgresql-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "back/**/pom.xml"

      - name: Run unit and real PostgreSQL integration tests
        working-directory: back
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify -Pintegration
