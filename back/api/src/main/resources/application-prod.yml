# Production profile.
# There are no defaults here: if an environment variable is missing, the
# application must refuse to start rather than use local credentials.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "mail.smtp.auth": ${MAIL_SMTP_AUTH:true}
      "mail.smtp.starttls.enable": ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  payment-proof:
    storage:
      root: ${PAYMENT_PROOF_STORAGE_ROOT}
    scanner:
      # Production has no allow-all fallback: clamd must be configured and reachable.
      mode: clamav
      clamav:
        host: ${CLAMAV_HOST}
        port: ${CLAMAV_PORT:3310}
        timeout: ${CLAMAV_TIMEOUT:PT10S}
  email:
    from: ${INVITATION_EMAIL_FROM}
    sender-name: ${INVITATION_EMAIL_SENDER_NAME}
    public-base-url: ${INVITATION_PUBLIC_BASE_URL}
    onboarding-path: ${INVITATION_ONBOARDING_PATH:/onboarding/payer}
    verification-path: ${ACCOUNT_VERIFICATION_PATH:/registro/verificacion}
    poll-delay: ${INVITATION_EMAIL_POLL_DELAY:PT5S}
    max-attempts: ${INVITATION_EMAIL_MAX_ATTEMPTS:10}
    outbox-encryption-key: ${INVITATION_OUTBOX_ENCRYPTION_KEY}

management:
  endpoint:
    health:
      # Do not expose internal details through public probes.
      show-details: never

logging:
  level:
    root: WARN
    com.project.backend: INFO
